<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Sustainable Development Crescent</title>
<style>
  :root{--navy:#001d2c;--teal:#2ea4bb;--green:#2f755b;--paper:#f2efe8;--ink:#14181a;--muted:#565f5c;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Lato',Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:8px;box-shadow:0 8px 30px rgba(0,29,44,.12);padding:40px 36px;width:100%;max-width:380px}
  h1{font-size:1.25rem;margin:0 0 4px;color:var(--navy)}
  p.sub{margin:0 0 24px;color:var(--muted);font-size:.9rem}
  label{display:block;font-size:.85rem;font-weight:700;margin-bottom:6px;color:var(--navy)}
  input[type=password]{width:100%;padding:11px 12px;border:1px solid #d8d3c6;border-radius:6px;font-size:1rem;margin-bottom:16px}
  button{width:100%;padding:12px;border:0;border-radius:6px;background:var(--teal);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
  button:hover{background:var(--green)}
  button:disabled{opacity:.6;cursor:default}
  .error{color:#b3261e;font-size:.85rem;margin:-8px 0 16px;display:none}
  .back{display:block;text-align:center;margin-top:18px;font-size:.85rem}
  .back a{color:var(--muted)}
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <h1>Admin Login</h1>
    <p class="sub">Sustainable Development Crescent — project updates</p>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autofocus>
    <p class="error" id="error">Incorrect password.</p>
    <button type="submit" id="submitBtn">Log in</button>
    <p class="back"><a href="../index.html">&larr; Back to site</a></p>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('error');
    const btn = document.getElementById('submitBtn');

    // Already logged in? Skip straight to the dashboard.
    fetch('/api/admin/session').then(r => r.json()).then(d => {
      if (d.authenticated) window.location.href = 'dashboard.html';
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        if (res.ok) {
          window.location.href = 'dashboard.html';
          return;
        }
        err.textContent = 'Incorrect password.';
        err.style.display = 'block';
      } catch {
        err.textContent = 'Could not reach the server. Try again.';
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
